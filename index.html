<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockTera — Block Puzzle Game</title>
<meta name="description" content="BlockTera is a relaxing offline block puzzle. Pieces are never rigged. No timer, no energy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1A2340; --panel:#232E52; --stroke:#35426E; --text:#FFFFFF; --muted:#9AA5C6; --gold:#FFD93D; --orange:#FF9F43; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         font-family:"Nunito",system-ui,sans-serif; color:var(--text);
         background:radial-gradient(circle at 50% 35%, #232E52 0%, #1A2340 55%, #141B33 100%); }
  main { width:100%; max-width:440px; text-align:center; }
  .blocks { display:grid; grid-template-columns:repeat(3,28px); gap:4px; justify-content:center; margin-bottom:28px; }
  .blocks span { width:28px; height:28px; border-radius:6px; box-shadow:inset 0 3px 0 rgba(255,255,255,.28), inset 0 -3px 0 rgba(0,0,0,.2); }
  h1 { font-weight:800; font-size:44px; letter-spacing:.5px; line-height:1.1;
       background:linear-gradient(90deg,var(--gold),var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { margin-top:12px; font-weight:600; font-size:17px; color:var(--muted); line-height:1.5; }
  .cta { display:inline-block; margin-top:32px; padding:15px 32px; border-radius:999px; text-decoration:none;
         font-weight:700; font-size:18px; letter-spacing:.5px; color:#4A2E00;
         background:linear-gradient(90deg,var(--gold),var(--orange)); }
  .card { margin-top:40px; padding:20px; border-radius:24px; background:var(--panel); border:1px solid var(--stroke);
          font-weight:600; font-size:14px; color:var(--muted); line-height:1.9; }
  .card a { color:#9FB2FF; text-decoration:none; }
  footer { margin-top:24px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="blocks" aria-hidden="true">
    <span style="background:#FF5A5F"></span><span style="background:#FFD93D"></span><span style="background:#5A7BFF"></span>
    <span style="background:#4ECB71"></span><span style="background:#3EC6E0"></span><span style="background:#B067E8"></span>
  </div>
  <h1>BlockTera</h1>
  <p class="tag">A relaxing offline block puzzle.<br>Pieces are never rigged. No timer, no energy.</p>
  <a class="cta" href="https://play.google.com/store/apps/details?id=com.aistudio.blockbazaar.pzxqy">Get it on Google Play</a>
  <div class="card">
    Support: <a href="mailto:blocktera.support@gmail.com">blocktera.support@gmail.com</a><br>
    <a href="https://mousmani323.github.io/blocktera-privacy/">Privacy Policy</a>
  </div>
  <footer>© 2026 Drivenstack Games</footer>
</main>
</body>
</html>
